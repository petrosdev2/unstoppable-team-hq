<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unstoppable Team HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF;--surface:#FFFFFF;--surface2:#F6F8F6;--ink:#14231C;--muted:#5E6E66;--line:#D5DED8;
  --green:#1E6B47;--green-ink:#FFFFFF;--green-soft:#DDEEE4;--gold:#9A6F1E;--gold-soft:#F5EAD2;
  --red:#A8412B;--red-soft:#F6E0DA;--blue:#2B5C8A;--blue-soft:#DCE8F3;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1714;--surface:#17221D;--surface2:#1C2923;--ink:#E6EEE9;--muted:#93A39A;--line:#2A3832;
  --green:#4FB985;--green-ink:#08140E;--green-soft:#1C3328;--gold:#D9AE55;--gold-soft:#33291A;
  --red:#E07A62;--red-soft:#3A221C;--blue:#7FB0E0;--blue-soft:#1B2A38;}}
:root[data-theme="dark"]{
  --bg:#0F1714;--surface:#17221D;--surface2:#1C2923;--ink:#E6EEE9;--muted:#93A39A;--line:#2A3832;
  --green:#4FB985;--green-ink:#08140E;--green-soft:#1C3328;--gold:#D9AE55;--gold-soft:#33291A;
  --red:#E07A62;--red-soft:#3A221C;--blue:#7FB0E0;--blue-soft:#1B2A38;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.05;padding:0 10px 18px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);margin-top:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--green-soft);color:var(--green)}
.nav svg{width:18px;height:18px;flex:none}
.side .who{margin-top:auto;padding:10px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}
.main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--surface2);font-size:.8rem}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.av{width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;overflow:hidden;object-fit:cover}
.av.lg{width:88px;height:88px;font-size:1.6rem}
.name-cell{display:flex;align-items:center;gap:10px}
.stat{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1}
.statlbl{color:var(--muted);font-size:.85rem;margin-top:4px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* kiosk */
.kiosk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,6rem);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kiosk-head .date{font-size:1.05rem;opacity:.8;margin-top:8px}
.kiosk-head .office{font-family:var(--display);font-size:1.3rem;font-weight:700;text-align:right}
.kiosk-head .counts{opacity:.8;text-align:right;font-size:.95rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.tile{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:70px}
.tile:hover{border-color:var(--green)}
.tile.in{border-color:var(--green);background:var(--green-soft)}
.tile.out{opacity:.65}
.tile b{display:block;font-weight:700;line-height:1.2}
.tile span{font-size:.8rem;color:var(--muted)}
.bigsearch{width:100%;font-size:1.1rem;padding:14px 16px;border-radius:12px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.5);display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:760px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.narrow{max-width:420px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.x{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
fieldset{border:0;border-top:1px solid var(--line);margin:18px 0 0;padding:16px 0 0}
legend{font-family:var(--display);font-weight:700;padding-right:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:.95rem;width:100%}
label.f.full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:.85rem}
.dl dd{margin:0;overflow-wrap:anywhere}
.section-t{margin:20px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:80}
.pin{font-size:1.6rem;letter-spacing:.4em;text-align:center;width:100%;padding:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--green);color:var(--green-ink)}
.alert{background:var(--red-soft);color:var(--red);border-radius:10px;padding:12px 14px;font-weight:600}
.bottom{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 6px;cursor:pointer}
  .bottom a.on{color:var(--green)}
  .bottom svg{width:22px;height:22px}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:860px){.bottom{overflow-x:auto;justify-content:flex-start!important;scrollbar-width:none}.bottom::-webkit-scrollbar{display:none}.bottom a{flex:0 0 auto;min-width:64px}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:30vh">Loading Unstoppable Team HQ…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="app.js?v=4"></script>
</body>
</html>
